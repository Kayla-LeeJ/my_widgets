[Metadata]
Name=Weather card
Information=Current weather and a 3-day forecast from open-meteo.com over a "living sky": the background follows the real sunrise and sunset, with stars and the current moon phase at night and clouds, rain or snow to match the weather. Location is set in @Resources\Variables.inc.
Version=1.0
License=MIT

[Variables]
CardW=340
CardH=170
; Painted by Weather.lua
SkyTop=8,12,32
SkyBottom=28,36,72
StarAlpha=0
StarAlphaDim=0
CloudColor=245,248,255
CloudAlpha1=0
CloudAlpha2=0
CloudAlpha3=0
; Includes go last: anything after them would land in the included sections
@Include=#@#Variables.inc
@Include2=#@#Common.inc

; ---------------------------------------------------------------- Measures

; Fetched every 15 minutes
[MeasureWeather]
Measure=WebParser
URL=https://api.open-meteo.com/v1/forecast?latitude=#WeatherLat#&longitude=#WeatherLon#&current=temperature_2m,apparent_temperature,weather_code,is_day,wind_speed_10m,cloud_cover&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=auto&forecast_days=4&temperature_unit=#WeatherUnits#
UpdateRate=900
CodePage=65001
RegExp=(?s)^(.*)$
FinishAction=[!CommandMeasure MeasureSky "Refresh()"]

; Repaints the sky every 30 s (sun position, dawn/dusk colors); new data repaints at once
[MeasureSky]
Measure=Script
ScriptFile=#@#Weather.lua
UpdateDivider=30

; ---------------------------------------------------------------- Sky

[MeterSky]
Meter=Shape
Shape=Rectangle 0.5,0.5,(#CardW#-1),(#CardH#-1),12 | Fill LinearGradient Sky | StrokeWidth 1 | Stroke Color #ColorBorder#
Sky=90 | #SkyTop#,240 ; 0.0 | #SkyBottom#,240 ; 1.0
DynamicVariables=1

; Shapes for these are built by Weather.lua
[MeterStars]
Meter=Shape
Shape=Ellipse 0,0,0
DynamicVariables=1

[MeterSun]
Meter=Shape
X=0
Y=0
Shape=Ellipse 24,24,24 | Fill Color 255,220,120,50 | StrokeWidth 0
Shape2=Ellipse 24,24,16 | Fill Color 255,214,110,90 | StrokeWidth 0
Shape3=Ellipse 24,24,11 | Fill Color 255,236,170 | StrokeWidth 0
Hidden=1

[MeterMoon]
Meter=Shape
X=288
Y=12
Shape=Ellipse 0,0,0
Hidden=1

[StyleCloud]
Shape=Ellipse 26,26,16,12 | StrokeWidth 0
Shape2=Ellipse 44,20,17,14 | StrokeWidth 0
Shape3=Ellipse 61,28,14,10 | StrokeWidth 0
Shape4=Rectangle 12,26,60,12,6 | StrokeWidth 0
Shape5=Combine Shape | Union Shape2 | Union Shape3 | Union Shape4
DynamicVariables=1

[MeterCloud1]
Meter=Shape
MeterStyle=StyleCloud
X=176
Y=10
Shape=Ellipse 26,26,16,12 | StrokeWidth 0 | Fill Color #CloudColor#,#CloudAlpha1#
Hidden=1

[MeterCloud2]
Meter=Shape
MeterStyle=StyleCloud
X=246
Y=40
Shape=Ellipse 26,26,16,12 | StrokeWidth 0 | Fill Color #CloudColor#,#CloudAlpha2#
Hidden=1

[MeterCloud3]
Meter=Shape
MeterStyle=StyleCloud
X=200
Y=62
Shape=Ellipse 26,26,16,12 | StrokeWidth 0 | Fill Color #CloudColor#,#CloudAlpha3#
Hidden=1

[MeterPrecip]
Meter=Shape
Shape=Ellipse 0,0,0
DynamicVariables=1
Hidden=1

[MeterBolt]
Meter=Shape
X=262
Y=56
Shape=Path Bolt | Fill Color 255,226,110 | StrokeWidth 0
Bolt=10,0 | LineTo 2,14 | LineTo 8,14 | LineTo 4,26 | LineTo 16,10 | LineTo 10,10 | LineTo 14,0 | ClosePath 1
Hidden=1

; ---------------------------------------------------------------- Text

[StyleSkyText]
FontFace=#FontFace#
FontColor=255,255,255
AntiAlias=1
StringEffect=Shadow
FontEffectColor=0,0,0,110

[MeterCity]
Meter=String
MeterStyle=StyleSkyText
X=16
Y=12
FontSize=9
StringStyle=Bold
StringCase=Upper
FontColor=255,255,255,210
Text=#WeatherCity#

[MeterTemp]
Meter=String
MeterStyle=StyleSkyText
X=13
Y=24
FontSize=30
StringStyle=Bold
Text=--

[MeterCondition]
Meter=String
MeterStyle=StyleSkyText
X=16
Y=76
FontSize=9
FontColor=255,255,255,230
Text=Loading weather...

[MeterHiLo]
Meter=String
MeterStyle=StyleSkyText
X=16
Y=94
FontSize=9
FontColor=255,255,255,200

; Forecast strip
[MeterStrip]
Meter=Shape
Shape=Rectangle 8,122,(#CardW#-16),40,8 | Fill Color 0,0,0,60 | StrokeWidth 0

[StyleDay]

Y=133
FontSize=9
StringAlign=Center

[MeterDay1]
Meter=String
MeterStyle=StyleSkyText | StyleDay
X=58

[MeterDay2]
Meter=String
MeterStyle=StyleSkyText | StyleDay
X=170

[MeterDay3]
Meter=String
MeterStyle=StyleSkyText | StyleDay
X=282
