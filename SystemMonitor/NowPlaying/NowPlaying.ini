[Metadata]
Name=Now Playing card
Information=Clock and date, plus whatever is playing in Windows' media controls (Spotify, browsers, Media Player...). Track info comes from @Resources\DeskHelper.ps1, which this skin starts automatically.
Version=1.1
License=MIT

[Variables]
; Command for the next click: prev | playpause | next
NPCmd=none
CardW=340
; Card height starts in the "nothing playing" layout
CardH=92
CardBg=Fill Color #ColorBg# | StrokeWidth 1 | Stroke Color #ColorBorder#
ShowMusic=[!ShowMeterGroup Music][!HideMeter MeterIdle][!SetOption MeterBackground Shape "Rectangle 0.5,0.5,(#CardW#-1),167,12 | #CardBg#"][!UpdateMeter *][!Redraw]
ShowIdle=[!HideMeterGroup Music][!ShowMeter MeterIdle][!SetOption MeterBackground Shape "Rectangle 0.5,0.5,(#CardW#-1),91,12 | #CardBg#"][!UpdateMeter *][!Redraw]
; Includes go last: anything after them would land in the included sections
@Include=#@#Variables.inc
@Include2=#@#Common.inc
@Include3=#@#Helper.inc

; ---------------------------------------------------------------- Clock

[MeasureTime]
Measure=Time
Format=%#I:%M

[MeasureAmPm]
Measure=Time
Format=%p

[MeasureDate]
Measure=Time
Format=%A, %B %#d

; ---------------------------------------------------------------- Track info (from DeskHelper.ps1)

[MeasureNP]
Measure=WebParser
URL=http://localhost:#HelperPort#/state
UpdateRate=1
ForceReload=1
CodePage=65001
RegExp=(?s)status=([^\n]*)\ntitle=([^\n]*)\nartist=([^\n]*)\napp=([^\n]*)\npos=([^\n]*)\ndur=([^\n]*)\ncover=([^\n]*)
; Show new data as soon as it arrives instead of on the next 1-second skin update
FinishAction=[!SetVariable HelperOk 1][!UpdateMeasureGroup NP][!UpdateMeterGroup Music][!Redraw]
OnConnectErrorAction=[!SetVariable HelperOk 0]
OnRegExpErrorAction=[!SetVariable HelperOk 0]

[MeasureStatus]
Measure=WebParser
URL=[MeasureNP]
Group=NP
StringIndex=1
IfMatch=^Playing$
IfMatchAction=[!SetOption MeterPlay Text "[\xE769]"][!UpdateMeter MeterPlay][!Redraw]
IfNotMatchAction=[!SetOption MeterPlay Text "[\xE768]"][!UpdateMeter MeterPlay][!Redraw]

[MeasureTitle]
Measure=WebParser
URL=[MeasureNP]
Group=NP
StringIndex=2

[MeasureArtist]
Measure=WebParser
URL=[MeasureNP]
Group=NP
StringIndex=3

[MeasureApp]
Measure=WebParser
URL=[MeasureNP]
Group=NP
StringIndex=4

[MeasurePos]
Measure=WebParser
URL=[MeasureNP]
Group=NP
StringIndex=5

[MeasureDur]
Measure=WebParser
URL=[MeasureNP]
Group=NP
StringIndex=6

[MeasureCover]
Measure=WebParser
URL=[MeasureNP]
Group=NP
StringIndex=7

[MeasureProgress]
Measure=Calc
Formula=(MeasureDur > 0) ? (MeasurePos / MeasureDur) : 0
Group=NP
MinValue=0
MaxValue=1

; "1Playing" / "0Playing": a stale status from a helper that stopped answering doesn't count
[MeasureView]
Measure=String
String=#HelperOk#[MeasureStatus]
Group=NP
DynamicVariables=1
IfMatch=^1(Playing|Paused)$
IfMatchAction=#ShowMusic#
IfNotMatchAction=#ShowIdle#

; Sends one command per click, then refreshes the track info right away
[MeasureCmd]
Measure=WebParser
URL=http://localhost:#HelperPort#/cmd/#NPCmd#
DynamicVariables=1
UpdateRate=86400
RegExp=(?s)(.*)
FinishAction=[!SetVariable NPCmd none][!CommandMeasure MeasureNP "Update"]

; ---------------------------------------------------------------- Clock meters

[MeterTime]
Meter=String
MeterStyle=StyleBig
MeasureName=MeasureTime
X=14
Y=8
FontSize=26

[MeterAmPm]
Meter=String
MeterStyle=StyleLabel
MeasureName=MeasureAmPm
X=4R
Y=26r
FontSize=10
StringStyle=Bold

[MeterDate]
Meter=String
MeterStyle=StyleLabel
MeasureName=MeasureDate
X=(#CardW#-16)
Y=26
FontSize=9
StringAlign=Right

[MeterDivider]
Meter=Shape
Shape=Line 16,58,(#CardW#-16),58 | StrokeWidth 1 | Stroke Color #ColorBorder#

[MeterIdle]
Meter=String
MeterStyle=StyleLabel
X=16
Y=66
FontSize=9
Text=Nothing playing

; ---------------------------------------------------------------- Music meters

[MeterCoverBox]
Meter=Shape
Shape=Rectangle 16,68,64,64,8 | Fill Color #ColorTrack# | StrokeWidth 0
Group=Music
Hidden=1

[MeterCoverPlaceholder]
Meter=String
X=48
Y=88
FontFace=#IconFont#
FontSize=18
FontColor=#ColorDim#
StringAlign=Center
AntiAlias=1
Text=[\xE8D6]
Group=Music
Hidden=1

[MeterCoverMask]
Meter=Shape
X=16
Y=68
Shape=Rectangle 0,0,64,64,8 | Fill Color 255,255,255 | StrokeWidth 0
Group=Music
Hidden=1

[MeterCover]
Meter=Image
ImageName=[MeasureCover]
Container=MeterCoverMask
X=0
Y=0
W=64
H=64
PreserveAspectRatio=2
DynamicVariables=1
Group=Music
Hidden=1

[MeterTitle]
Meter=String
MeterStyle=StyleText
MeasureName=MeasureTitle
X=92
Y=66
W=(#CardW#-108)
FontSize=10
StringStyle=Bold
ClipString=1
Group=Music
Hidden=1

[MeterArtist]
Meter=String
MeterStyle=StyleLabel
MeasureName=MeasureArtist
X=92
Y=85
W=(#CardW#-108)
FontSize=9
ClipString=1
Group=Music
Hidden=1

[StyleButton]
FontFace=#IconFont#
FontColor=#ColorText#
FontSize=12
AntiAlias=1
SolidColor=0,0,0,1
Padding=4,4,4,4
Y=104
MouseOverAction=[!SetOption #CURRENTSECTION# FontColor "#ColorCool#"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# FontColor "#ColorText#"][!UpdateMeter #CURRENTSECTION#][!Redraw]
Group=Music
Hidden=1

[MeterPrev]
Meter=String
MeterStyle=StyleButton
X=88
Text=[\xE892]
LeftMouseUpAction=[!SetVariable NPCmd prev][!UpdateMeasure MeasureCmd][!CommandMeasure MeasureCmd "Update"]

[MeterPlay]
Meter=String
MeterStyle=StyleButton
X=118
FontSize=14
Y=101
Text=[\xE768]
LeftMouseUpAction=[!CommandMeasure MeasureScript "TogglePlayIcon()"][!SetVariable NPCmd playpause][!UpdateMeasure MeasureCmd][!CommandMeasure MeasureCmd "Update"]

[MeterNext]
Meter=String
MeterStyle=StyleButton
X=152
Text=[\xE893]
LeftMouseUpAction=[!SetVariable NPCmd next][!UpdateMeasure MeasureCmd][!CommandMeasure MeasureCmd "Update"]

[MeterApp]
Meter=String
MeterStyle=StyleLabel
MeasureName=MeasureApp
X=(#CardW#-16)
Y=111
StringAlign=Right
Group=Music
Hidden=1

[MeterElapsed]
Meter=String
MeterStyle=StyleLabel
X=16
Y=142
Text=[&MeasureScript:Duration('MeasurePos')]
DynamicVariables=1
Group=Music
Hidden=1

[MeterProgress]
Meter=Bar
MeasureName=MeasureProgress
X=56
Y=148
W=(#CardW#-112)
H=3
BarOrientation=Horizontal
BarColor=#ColorCool#
SolidColor=#ColorTrack#
Group=Music
Hidden=1

[MeterTotal]
Meter=String
MeterStyle=StyleLabel
X=(#CardW#-16)
Y=142
StringAlign=Right
Text=[&MeasureScript:Duration('MeasureDur')]
DynamicVariables=1
Group=Music
Hidden=1
