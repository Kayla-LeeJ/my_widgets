[Metadata]
Name=GPU card
Information=GPU load, core and hot spot temperature, and VRAM use, from LibreHardwareMonitor.
Version=1.0
License=MIT

[Variables]
CardW=260
CardH=170
; Includes go last: anything after them would land in the included sections
@Include=#@#Variables.inc
@Include2=#@#Common.inc
@Include3=#@#LHM.inc

; ---------------------------------------------------------------- Measures

[MeasureLoadRaw]
Measure=WebParser
URL=[MeasureLHM]
StringIndex=1
RegExp=#SensorRegExp##GpuLoad#"
StringIndex2=1

[MeasureTempRaw]
Measure=WebParser
URL=[MeasureLHM]
StringIndex=1
RegExp=#SensorRegExp##GpuTemp#"
StringIndex2=1

[MeasureHotSpotRaw]
Measure=WebParser
URL=[MeasureLHM]
StringIndex=1
RegExp=#SensorRegExp##GpuHotSpot#"
StringIndex2=1

[MeasureVramUsedRaw]
Measure=WebParser
URL=[MeasureLHM]
StringIndex=1
RegExp=#SensorRegExp##GpuVramUsed#"
StringIndex2=1

[MeasureVramTotalRaw]
Measure=WebParser
URL=[MeasureLHM]
StringIndex=1
RegExp=#SensorRegExp##GpuVramTotal#"
StringIndex2=1

; -1 means "no data". Load can legitimately be 0, temperatures can't.
[MeasureLoad]
Measure=Calc
Formula=(#LHMOk# = 1) ? MeasureLoadRaw : -1
MinValue=0
MaxValue=100
DynamicVariables=1

[MeasureTemp]
Measure=Calc
Formula=((#LHMOk# = 1) && (MeasureTempRaw > 0)) ? MeasureTempRaw : -1
DynamicVariables=1

[MeasureHotSpot]
Measure=Calc
Formula=((#LHMOk# = 1) && (MeasureHotSpotRaw > 0)) ? MeasureHotSpotRaw : -1
DynamicVariables=1

[MeasureVramUsed]
Measure=Calc
Formula=((#LHMOk# = 1) && (MeasureVramTotalRaw > 0)) ? MeasureVramUsedRaw / 1024 : -1
DynamicVariables=1

[MeasureVramTotal]
Measure=Calc
Formula=((#LHMOk# = 1) && (MeasureVramTotalRaw > 0)) ? MeasureVramTotalRaw / 1024 : -1
DynamicVariables=1

; ---------------------------------------------------------------- Meters

[MeterTitle]
Meter=String
MeterStyle=StyleTitle
Text=GPU  [\x00B7]  #GPUName#

[MeterLoad]
Meter=String
MeterStyle=StyleBig
X=14
Y=30
Text=[&MeasureScript:Num('MeasureLoad')]%
DynamicVariables=1

[MeterLoadLabel]
Meter=String
MeterStyle=StyleLabel
X=16
Y=70
Text=load

[MeterTemp]
Meter=String
MeterStyle=StyleBig
X=136
Y=30
Text=[&MeasureScript:Num('MeasureTemp')][\x00B0]C
FontColor=[&MeasureScript:Color('MeasureTemp', #GpuWarm#, #GpuHot#)]
DynamicVariables=1

[MeterTempLabel]
Meter=String
MeterStyle=StyleLabel
X=138
Y=70
Text=core

[MeterGraphFill]
Meter=Histogram
MeasureName=MeasureLoad
X=16
Y=90
W=228
H=44
PrimaryColor=[&MeasureScript:Color('MeasureTemp', #GpuWarm#, #GpuHot#)],#GraphFillAlpha#
AntiAlias=1
DynamicVariables=1

[MeterGraphLine]
Meter=Line
MeasureName=MeasureLoad
X=16
Y=90
W=228
H=44
LineCount=1
LineColor=[&MeasureScript:Color('MeasureTemp', #GpuWarm#, #GpuHot#)]
AntiAlias=1
DynamicVariables=1

[MeterHotSpot]
Meter=String
MeterStyle=StyleLabel
X=16
Y=144
FontSize=9
Text=hot spot  [&MeasureScript:Num('MeasureHotSpot')][\x00B0]C
FontColor=[&MeasureScript:Color('MeasureHotSpot', #HotSpotWarm#, #HotSpotHot#)]
DynamicVariables=1

[MeterVram]
Meter=String
MeterStyle=StyleLabel
X=244
Y=144
FontSize=9
StringAlign=Right
Text=VRAM  [&MeasureScript:Num('MeasureVramUsed', 1)] / [&MeasureScript:Num('MeasureVramTotal', 1)] GB
DynamicVariables=1
