[Metadata]
Name=Drives card
Information=Temperature and used space for three drives, from LibreHardwareMonitor. Drives are set up in @Resources\Variables.inc.
Version=1.0
License=MIT

[Variables]
CardW=260
CardH=146
; Includes go last: anything after them would land in the included sections
@Include=#@#Variables.inc
@Include2=#@#Common.inc
@Include3=#@#LHM.inc

; ---------------------------------------------------------------- Measures
; Each drive: raw temperature and used %, then Calcs that give -1 for "no data".
; A missing temperature also blanks used space, so an unplugged drive shows "--".

[MeasureDrive1TempRaw]
Measure=WebParser
URL=[MeasureLHM]
StringIndex=1
RegExp=#SensorRegExp##Drive1Temp#"
StringIndex2=1

[MeasureDrive1UsedRaw]
Measure=WebParser
URL=[MeasureLHM]
StringIndex=1
RegExp=#SensorRegExp##Drive1Used#"
StringIndex2=1

[MeasureDrive2TempRaw]
Measure=WebParser
URL=[MeasureLHM]
StringIndex=1
RegExp=#SensorRegExp##Drive2Temp#"
StringIndex2=1

[MeasureDrive2UsedRaw]
Measure=WebParser
URL=[MeasureLHM]
StringIndex=1
RegExp=#SensorRegExp##Drive2Used#"
StringIndex2=1

[MeasureDrive3TempRaw]
Measure=WebParser
URL=[MeasureLHM]
StringIndex=1
RegExp=#SensorRegExp##Drive3Temp#"
StringIndex2=1

[MeasureDrive3UsedRaw]
Measure=WebParser
URL=[MeasureLHM]
StringIndex=1
RegExp=#SensorRegExp##Drive3Used#"
StringIndex2=1

[MeasureDrive1Temp]
Measure=Calc
Formula=((#LHMOk# = 1) && (MeasureDrive1TempRaw > 0)) ? MeasureDrive1TempRaw : -1
DynamicVariables=1

[MeasureDrive1Used]
Measure=Calc
Formula=(MeasureDrive1Temp >= 0) ? MeasureDrive1UsedRaw : -1
MinValue=0
MaxValue=100

[MeasureDrive2Temp]
Measure=Calc
Formula=((#LHMOk# = 1) && (MeasureDrive2TempRaw > 0)) ? MeasureDrive2TempRaw : -1
DynamicVariables=1

[MeasureDrive2Used]
Measure=Calc
Formula=(MeasureDrive2Temp >= 0) ? MeasureDrive2UsedRaw : -1
MinValue=0
MaxValue=100

[MeasureDrive3Temp]
Measure=Calc
Formula=((#LHMOk# = 1) && (MeasureDrive3TempRaw > 0)) ? MeasureDrive3TempRaw : -1
DynamicVariables=1

[MeasureDrive3Used]
Measure=Calc
Formula=(MeasureDrive3Temp >= 0) ? MeasureDrive3UsedRaw : -1
MinValue=0
MaxValue=100

; ---------------------------------------------------------------- Meters

[MeterTitle]
Meter=String
MeterStyle=StyleTitle
Text=DRIVES

[StyleName]
FontFace=#FontFace#
FontColor=#ColorText#
FontSize=9
AntiAlias=1
X=16

[StyleUsed]
FontFace=#FontFace#
FontSize=9
AntiAlias=1
StringAlign=Right
X=196
DynamicVariables=1

[StyleTemp]
FontFace=#FontFace#
FontSize=9
StringStyle=Bold
AntiAlias=1
StringAlign=Right
X=244
DynamicVariables=1

[StyleBar]
X=16
W=228
H=4
BarOrientation=Horizontal
SolidColor=#ColorTrack#
DynamicVariables=1

; Drive 1
[MeterDrive1Name]
Meter=String
MeterStyle=StyleName
Y=34
Text=#Drive1Label#

[MeterDrive1Used]
Meter=String
MeterStyle=StyleUsed
Y=34
Text=[&MeasureScript:Num('MeasureDrive1Used')]% used
FontColor=[&MeasureScript:Color('MeasureDrive1Used', #DiskWarm#, #DiskHot#)]

[MeterDrive1Temp]
Meter=String
MeterStyle=StyleTemp
Y=34
Text=[&MeasureScript:Num('MeasureDrive1Temp')][\x00B0]C
FontColor=[&MeasureScript:Color('MeasureDrive1Temp', #Drive1Warm#, #Drive1Hot#)]

[MeterDrive1Bar]
Meter=Bar
MeterStyle=StyleBar
MeasureName=MeasureDrive1Used
Y=54
BarColor=[&MeasureScript:Color('MeasureDrive1Used', #DiskWarm#, #DiskHot#)]

; Drive 2
[MeterDrive2Name]
Meter=String
MeterStyle=StyleName
Y=70
Text=#Drive2Label#

[MeterDrive2Used]
Meter=String
MeterStyle=StyleUsed
Y=70
Text=[&MeasureScript:Num('MeasureDrive2Used')]% used
FontColor=[&MeasureScript:Color('MeasureDrive2Used', #DiskWarm#, #DiskHot#)]

[MeterDrive2Temp]
Meter=String
MeterStyle=StyleTemp
Y=70
Text=[&MeasureScript:Num('MeasureDrive2Temp')][\x00B0]C
FontColor=[&MeasureScript:Color('MeasureDrive2Temp', #Drive2Warm#, #Drive2Hot#)]

[MeterDrive2Bar]
Meter=Bar
MeterStyle=StyleBar
MeasureName=MeasureDrive2Used
Y=90
BarColor=[&MeasureScript:Color('MeasureDrive2Used', #DiskWarm#, #DiskHot#)]

; Drive 3
[MeterDrive3Name]
Meter=String
MeterStyle=StyleName
Y=106
Text=#Drive3Label#

[MeterDrive3Used]
Meter=String
MeterStyle=StyleUsed
Y=106
Text=[&MeasureScript:Num('MeasureDrive3Used')]% used
FontColor=[&MeasureScript:Color('MeasureDrive3Used', #DiskWarm#, #DiskHot#)]

[MeterDrive3Temp]
Meter=String
MeterStyle=StyleTemp
Y=106
Text=[&MeasureScript:Num('MeasureDrive3Temp')][\x00B0]C
FontColor=[&MeasureScript:Color('MeasureDrive3Temp', #Drive3Warm#, #Drive3Hot#)]

[MeterDrive3Bar]
Meter=Bar
MeterStyle=StyleBar
MeasureName=MeasureDrive3Used
Y=126
BarColor=[&MeasureScript:Color('MeasureDrive3Used', #DiskWarm#, #DiskHot#)]
