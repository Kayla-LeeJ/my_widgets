[Metadata]
Name=Network card
Information=Live download and upload speed on the active network adapter. Built-in Rainmeter measures, no LibreHardwareMonitor needed.
Version=1.0
License=MIT

[Variables]
CardW=260
CardH=144
; Includes go last: anything after them would land in the included sections
@Include=#@#Variables.inc
@Include2=#@#Common.inc

; ---------------------------------------------------------------- Measures

; Interface=Best follows whichever adapter Windows is using for internet traffic
[MeasureNetIn]
Measure=NetIn
Interface=Best

[MeasureNetOut]
Measure=NetOut
Interface=Best

; ---------------------------------------------------------------- Meters

[MeterTitle]
Meter=String
MeterStyle=StyleTitle
Text=NETWORK

[StyleSpeed]
FontFace=#FontFace#
FontSize=16
StringStyle=Bold
AntiAlias=1
AutoScale=1
NumOfDecimals=1
Y=32
Text=%1B/s

[MeterDown]
Meter=String
MeterStyle=StyleSpeed
MeasureName=MeasureNetIn
X=14
FontColor=#ColorCool#

[MeterDownLabel]
Meter=String
MeterStyle=StyleLabel
X=16
Y=62
Text=download

[MeterUp]
Meter=String
MeterStyle=StyleSpeed
MeasureName=MeasureNetOut
X=136
FontColor=#ColorUpload#

[MeterUpLabel]
Meter=String
MeterStyle=StyleLabel
X=138
Y=62
Text=upload

[MeterGraph]
Meter=Line
MeasureName=MeasureNetIn
MeasureName2=MeasureNetOut
X=16
Y=84
W=228
H=44
LineCount=2
LineColor=#ColorCool#
LineColor2=#ColorUpload#
AutoScale=1
AntiAlias=1
