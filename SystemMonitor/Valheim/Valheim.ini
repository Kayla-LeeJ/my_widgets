[Metadata]
Name=Valheim server card
Information=Status of the Valheim dedicated server on this PC: online/offline, players and join code (crossplay). Start launches it through Steam, which runs the server's start_headless_server.bat. Players and join code need a -logFile in that .bat.
Version=1.0
License=MIT

[Variables]
CardW=340
CardH=112
; Offline status: light grey, readable on the dark art
ColorOffline=200,200,210
; Shared by every view: put the status label back on the live value and hide one-off notes
ResetView=[!SetOption MeterStatus Text "%1"][!HideMeter MeterHint][!HideMeter MeterNoInfo][!HideMeter MeterStopping][!HideMeterGroup StopConfirm]
OnlineView=[!SetOption MeterDot Shape "Ellipse 6,6,5 | Fill Color #ColorGood# | StrokeWidth 0"][!SetOption MeterStatus FontColor "#ColorGood#"]#ResetView#[!ShowMeterGroup Online][!HideMeterGroup Start][!ShowMeterGroup Stop][!UpdateMeter *][!Redraw]
StartingView=[!SetOption MeterDot Shape "Ellipse 6,6,5 | Fill Color #ColorWarm# | StrokeWidth 0"][!SetOption MeterStatus FontColor "#ColorWarm#"]#ResetView#[!HideMeterGroup Online][!HideMeterGroup Start][!HideMeterGroup Stop][!ShowMeter MeterHint][!UpdateMeter *][!Redraw]
RunningView=[!SetOption MeterDot Shape "Ellipse 6,6,5 | Fill Color #ColorGood# | StrokeWidth 0"][!SetOption MeterStatus FontColor "#ColorGood#"]#ResetView#[!HideMeterGroup Online][!ShowMeter MeterUptime][!ShowMeter MeterNoInfo][!HideMeterGroup Start][!ShowMeterGroup Stop][!UpdateMeter *][!Redraw]
OfflineView=[!SetOption MeterDot Shape "Ellipse 6,6,5 | Fill Color #ColorOffline# | StrokeWidth 0"][!SetOption MeterStatus FontColor "#ColorOffline#"]#ResetView#[!HideMeterGroup Online][!ShowMeterGroup Start][!HideMeterGroup Stop][!UpdateMeter *][!Redraw]
; Includes go last: anything after them would land in the included sections
@Include=#@#Variables.inc
@Include2=#@#Common.inc
@Include3=#@#Helper.inc

; ---------------------------------------------------------------- Measures

[MeasureServer]
Measure=WebParser
URL=http://localhost:#HelperPort#/valheim
UpdateRate=5
ForceReload=1
CodePage=65001
RegExp=(?s)status=([^\n]*)\nname=([^\n]*)\nworld=([^\n]*)\nplayers=([^\n]*)\njoincode=([^\n]*)\nuptime=([^\n]*)
FinishAction=[!SetVariable HelperOk 1][!UpdateMeasureGroup Server][!UpdateMeter *][!Redraw]
OnConnectErrorAction=[!SetVariable HelperOk 0]
OnRegExpErrorAction=[!SetVariable HelperOk 0]

[MeasureStatus]
Measure=WebParser
URL=[MeasureServer]
StringIndex=1
Group=Server

; What the status label shows
[MeasureStatusText]
Measure=String
String=[MeasureStatus]
DynamicVariables=1
Group=Server
Substitute="Running":"Online"

[MeasureName]
Measure=WebParser
URL=[MeasureServer]
StringIndex=2
Group=Server

[MeasureWorld]
Measure=WebParser
URL=[MeasureServer]
StringIndex=3
Group=Server

[MeasurePlayers]
Measure=WebParser
URL=[MeasureServer]
StringIndex=4
Group=Server
RegExpSubstitute=1
; Empty when the count isn't known (server started outside the widget)
Substitute="^$":"--","^1$":"1 player","^(\d+)$":"\1 players"

[MeasureJoinCode]
Measure=WebParser
URL=[MeasureServer]
StringIndex=5
Group=Server

[MeasureUptime]
Measure=WebParser
URL=[MeasureServer]
StringIndex=6
Group=Server

; "1Online" etc: a stale status from a helper that stopped answering counts as offline
[MeasureView]
Measure=String
String=#HelperOk#[MeasureStatus]
DynamicVariables=1
Group=Server
IfMatch=^1Online$
IfMatchAction=#OnlineView#
IfMatch2=^1Starting$
IfMatchAction2=#StartingView#
IfMatch3=^1Running$
IfMatchAction3=#RunningView#
IfMatch4=^(0.*|1Offline)$
IfMatchAction4=#OfflineView#

; ---------------------------------------------------------------- Background art

; Valheim campfire art (from Steam's library banner), clipped to the card's rounded corners
[MeterArtMask]
Meter=Shape
Shape=Rectangle 0,0,#CardW#,#CardH#,12 | Fill Color 255,255,255 | StrokeWidth 0

[MeterArt]
Meter=Image
ImageName=#@#Images\valheim-card.jpg
Container=MeterArtMask
W=#CardW#
H=#CardH#
PreserveAspectRatio=2

[MeterArtBorder]
Meter=Shape
Shape=Rectangle 0.5,0.5,(#CardW#-1),(#CardH#-1),12 | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #ColorBorder#

; ---------------------------------------------------------------- Text
; Light text with a soft shadow so it stays readable on the art

[StyleArt]
FontFace=#FontFace#
FontColor=225,225,232
AntiAlias=1
StringEffect=Shadow
FontEffectColor=0,0,0,170

[MeterTitle]
Meter=String
MeterStyle=StyleArt
X=16
Y=12
FontSize=9
StringStyle=Bold
FontColor=225,225,232,190
Text=VALHEIM SERVER

[MeterDot]
Meter=Shape
X=(#CardW#-90)
Y=15
Shape=Ellipse 6,6,5 | Fill Color #ColorOffline# | StrokeWidth 0

[MeterStatus]
Meter=String
MeterStyle=StyleArt
MeasureName=MeasureStatusText
X=(#CardW#-76)
Y=12
FontSize=9
StringStyle=Bold
FontColor=#ColorOffline#
Text=%1

[MeterName]
Meter=String
MeterStyle=StyleArt
MeasureName=MeasureName
X=16
Y=31
W=(#CardW#-32)
FontSize=15
StringStyle=Bold
FontColor=255,255,255
ClipString=1
Text=%1

[MeterWorld]
Meter=String
MeterStyle=StyleArt
MeasureName=MeasureWorld
X=16
Y=58
FontSize=9
FontColor=225,225,232,200
Text=world  %1

[MeterUptime]
Meter=String
MeterStyle=StyleArt
X=(#CardW#-16)
Y=58
FontSize=9
FontColor=225,225,232,200
StringAlign=Right
Text=[&MeasureScript:Uptime('MeasureUptime')]
DynamicVariables=1
Group=Online
Hidden=1

[MeterPlayers]
Meter=String
MeterStyle=StyleArt
MeasureName=MeasurePlayers
X=16
Y=82
FontSize=11
StringStyle=Bold
FontColor=#ColorGood#
Text=%1
Group=Online
Hidden=1

; Click to copy the crossplay join code
[MeterJoinCode]
Meter=String
MeterStyle=StyleArt
MeasureName=MeasureJoinCode
X=106
Y=85
FontSize=9
SolidColor=0,0,0,1
Text=join code  %1
ToolTipText=Click to copy the join code
LeftMouseUpAction=[!SetClip "[MeasureJoinCode]"][!SetOption #CURRENTSECTION# Text "copied!"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# Text "join code  %1"][!UpdateMeter #CURRENTSECTION#][!Redraw]
DynamicVariables=1
Group=Online
Hidden=1

[MeterNoInfo]
Meter=String
MeterStyle=StyleArt
X=16
Y=86
FontSize=8
FontColor=225,225,232,190
Text=No player info (server isn't writing a log)
ToolTipText=Add -logFile "valheim_server.log" to the server line in start_headless_server.bat to see players and the join code
Hidden=1

[MeterHint]
Meter=String
MeterStyle=StyleArt
X=16
Y=86
FontSize=8
FontColor=225,225,232,190
Text=Loading the world... stop it with Ctrl+C in the server window
Hidden=1

[MeterStopping]
Meter=String
MeterStyle=StyleArt
X=16
Y=86
FontSize=8
FontColor=225,225,232,190
Text=Saving the world and shutting down...
Hidden=1

; ---------------------------------------------------------------- Start button
; A slim translucent pill; the shape takes the clicks, the icon and label sit on top

[MeterStartPill]
Meter=Shape
X=(#CardW#-130)
Y=78
Shape=Rectangle 0.5,0.5,113,27,13.5 | Fill Color 255,255,255,30 | StrokeWidth 1 | Stroke Color 255,255,255,80
ToolTipText=Starts the server through Steam (Steam runs start_headless_server.bat)
LeftMouseUpAction=["steam://rungameid/896660"][!SetOption MeterStatus Text "Starting"][!HideMeterGroup Start][!ShowMeter MeterHint][!UpdateMeter *][!Redraw]
MouseOverAction=[!SetOption #CURRENTSECTION# Shape "Rectangle 0.5,0.5,113,27,13.5 | Fill Color #ColorGood#,70 | StrokeWidth 1 | Stroke Color #ColorGood#"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# Shape "Rectangle 0.5,0.5,113,27,13.5 | Fill Color 255,255,255,30 | StrokeWidth 1 | Stroke Color 255,255,255,80"][!UpdateMeter #CURRENTSECTION#][!Redraw]
Group=Start
Hidden=1

[MeterStartIcon]
Meter=String
X=(#CardW#-114)
Y=85
FontFace=#IconFont#
FontSize=9
FontColor=255,255,255
AntiAlias=1
Text=[\xE768]
Group=Start
Hidden=1

[MeterStartLabel]
Meter=String
MeterStyle=StyleArt
X=(#CardW#-96)
Y=83
FontSize=9
StringStyle=Bold
FontColor=255,255,255
Text=Start server
Group=Start
Hidden=1

; ---------------------------------------------------------------- Stop button
; Two clicks: "Stop server" turns into a red "Confirm stop"; moving the mouse away cancels.
; Stopping sends Ctrl+C to the server window, so the world is saved first.

[MeterStopPill]
Meter=Shape
X=(#CardW#-130)
Y=78
Shape=Rectangle 0.5,0.5,113,27,13.5 | Fill Color 255,255,255,30 | StrokeWidth 1 | Stroke Color 255,255,255,80
ToolTipText=Saves the world and stops the server (like Ctrl+C in its window)
LeftMouseUpAction=[!HideMeterGroup Stop][!ShowMeterGroup StopConfirm][!UpdateMeter *][!Redraw]
MouseOverAction=[!SetOption #CURRENTSECTION# Shape "Rectangle 0.5,0.5,113,27,13.5 | Fill Color 255,255,255,55 | StrokeWidth 1 | Stroke Color 255,255,255,140"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# Shape "Rectangle 0.5,0.5,113,27,13.5 | Fill Color 255,255,255,30 | StrokeWidth 1 | Stroke Color 255,255,255,80"][!UpdateMeter #CURRENTSECTION#][!Redraw]
Group=Stop
Hidden=1

[MeterStopIcon]
Meter=String
X=(#CardW#-114)
Y=85
FontFace=#IconFont#
FontSize=9
FontColor=255,255,255
AntiAlias=1
Text=[\xE71A]
Group=Stop
Hidden=1

[MeterStopLabel]
Meter=String
MeterStyle=StyleArt
X=(#CardW#-96)
Y=83
FontSize=9
StringStyle=Bold
FontColor=255,255,255
Text=Stop server
Group=Stop
Hidden=1

[MeterConfirmPill]
Meter=Shape
X=(#CardW#-130)
Y=78
Shape=Rectangle 0.5,0.5,113,27,13.5 | Fill Color #ColorHot#,170 | StrokeWidth 1 | Stroke Color #ColorHot#
ToolTipText=Click to save and stop the server. Move the mouse away to cancel.
LeftMouseUpAction=["conhost.exe" --headless powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#StopValheimServer.ps1"][!HideMeterGroup StopConfirm][!HideMeterGroup Online][!SetOption MeterStatus Text "Stopping"][!SetOption MeterStatus FontColor "#ColorWarm#"][!SetOption MeterDot Shape "Ellipse 6,6,5 | Fill Color #ColorWarm# | StrokeWidth 0"][!ShowMeter MeterStopping][!UpdateMeter *][!Redraw]
MouseLeaveAction=[!HideMeterGroup StopConfirm][!ShowMeterGroup Stop][!UpdateMeter *][!Redraw]
Group=StopConfirm
Hidden=1

[MeterConfirmLabel]
Meter=String
MeterStyle=StyleArt
X=(#CardW#-73)
Y=83
FontSize=9
StringStyle=Bold
StringAlign=Center
FontColor=255,255,255
Text=Confirm stop
Group=StopConfirm
Hidden=1
