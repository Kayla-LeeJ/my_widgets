[Metadata]
Name=Game dock
Information=Launcher for every installed game (Steam, Battle.net, Epic), found automatically and kept up to date. A dot under an icon means that game is running. Per-game tweaks (custom icons, modded Valheim) are at the top of @Resources\ScanGames.ps1.
Version=2.0
License=MIT

[Rainmeter]
Update=1000
AccurateText=1
; Right-click menu: switch colour theme for every widget at once
ContextTitle=Theme: Midnight
ContextAction=[!WriteKeyValue Variables Theme Midnight "#@#Variables.inc"][!RefreshApp]
ContextTitle2=Theme: Sakura
ContextAction2=[!WriteKeyValue Variables Theme Sakura "#@#Variables.inc"][!RefreshApp]
ContextTitle3=Theme: Forest
ContextAction3=[!WriteKeyValue Variables Theme Forest "#@#Variables.inc"][!RefreshApp]
ContextTitle4=Theme: Ocean
ContextAction4=[!WriteKeyValue Variables Theme Ocean "#@#Variables.inc"][!RefreshApp]
ContextTitle5=Theme: Mono
ContextAction5=[!WriteKeyValue Variables Theme Mono "#@#Variables.inc"][!RefreshApp]

[Variables]
; Icon size
Icon=40
; Seconds between checks for newly installed or removed games
ScanEvery=60
; Set by Games.inc
DockW=271
DockH=65
@Include=#@#Variables.inc

; ---------------------------------------------------------------- Installed games
; ScanGames.ps1 rewrites Games.inc and refreshes this skin whenever the installed games change

[MeasureScan]
Measure=Calc
Formula=(MeasureScan % #ScanEvery#) + 1
IfCondition=MeasureScan = 1
IfTrueAction=["conhost.exe" --headless powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#ScanGames.ps1" -Out "#CURRENTPATH#Games.inc" -Rainmeter "#PROGRAMPATH#Rainmeter.exe" -Config "#CURRENTCONFIG#" -Columns #DockColumns# -Hide "#DockHide#"]

; ---------------------------------------------------------------- Meters

[MeterBackground]
Meter=Shape
Shape=Rectangle 0.5,0.5,(#DockW#-1),(#DockH#-1),18 | Fill Color #ColorBg# | StrokeWidth 1 | Stroke Color #ColorBorder#
DynamicVariables=1

[StyleIcon]
W=#Icon#
H=#Icon#
AntiAlias=1
SolidColor=0,0,0,1

; Stand-in for a game with no icon
[StyleLetter]
FontFace=#FontFace#
FontSize=16
StringStyle=Bold
StringAlign=CenterCenter
FontColor=#ColorText#
SolidColor=255,255,255,30
Padding=0,0,0,0

; Tells the Valheim server icon apart from the game's
[StyleBadge]
FontFace=#FontFace#
FontSize=6
StringStyle=Bold
StringAlign=Right
FontColor=18,18,24
SolidColor=#ColorGood#
Padding=3,1,3,1
AntiAlias=1

[StyleDot]
Shape=Ellipse 2.5,2.5,2.5 | Fill Color #ColorCool# | StrokeWidth 0
Hidden=1

[Games]
@IncludeGames=#CURRENTPATH#Games.inc
