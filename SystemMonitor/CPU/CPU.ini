[Metadata]
Name=CPU card
Information=CPU usage, package temperature and hottest core. Temperatures come from LibreHardwareMonitor.
Version=2.0
License=MIT

[Variables]
CardW=260
CardH=170
; Includes go last: anything after them would land in the included sections
@Include=#@#Variables.inc
@Include2=#@#Common.inc
@Include3=#@#LHM.inc

; ---------------------------------------------------------------- Measures

[MeasureCPU]
Measure=CPU
Processor=0

[MeasureCPUName]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=HARDWARE\DESCRIPTION\System\CentralProcessor\0
RegValue=ProcessorNameString
RegExpSubstitute=1
Substitute="\((R|TM)\)":"","\s*CPU\s*@.*$":"","^Intel\s+Core\s+":"","^AMD\s+":"","\s+":" "
UpdateDivider=-1

[MeasurePkgRaw]
Measure=WebParser
URL=[MeasureLHM]
StringIndex=1
RegExp=#SensorRegExp##CpuPackageTemp#"
StringIndex2=1

[MeasureCoreMaxRaw]
Measure=WebParser
URL=[MeasureLHM]
StringIndex=1
RegExp=#SensorRegExp##CpuCoreMaxTemp#"
StringIndex2=1

; -1 means "no data"
[MeasurePkgTemp]
Measure=Calc
Formula=((#LHMOk# = 1) && (MeasurePkgRaw > 0)) ? MeasurePkgRaw : -1
DynamicVariables=1

[MeasureCoreMaxTemp]
Measure=Calc
Formula=((#LHMOk# = 1) && (MeasureCoreMaxRaw > 0)) ? MeasureCoreMaxRaw : -1
DynamicVariables=1

; ---------------------------------------------------------------- Meters

[MeterTitle]
Meter=String
MeterStyle=StyleTitle
MeasureName=MeasureCPUName
Text=CPU  [\x00B7]  %1

[MeterUsage]
Meter=String
MeterStyle=StyleBig
MeasureName=MeasureCPU
X=14
Y=30
NumOfDecimals=0
Text=%1%

[MeterUsageLabel]
Meter=String
MeterStyle=StyleLabel
X=16
Y=70
Text=usage

[MeterPkgTemp]
Meter=String
MeterStyle=StyleBig
X=136
Y=30
Text=[&MeasureScript:Num('MeasurePkgTemp')][\x00B0]C
FontColor=[&MeasureScript:Color('MeasurePkgTemp', #CpuWarm#, #CpuHot#)]
DynamicVariables=1

[MeterPkgLabel]
Meter=String
MeterStyle=StyleLabel
X=138
Y=70
Text=package

[MeterGraphFill]
Meter=Histogram
MeasureName=MeasureCPU
X=16
Y=90
W=228
H=44
PrimaryColor=[&MeasureScript:Color('MeasurePkgTemp', #CpuWarm#, #CpuHot#)],#GraphFillAlpha#
AntiAlias=1
DynamicVariables=1

[MeterGraphLine]
Meter=Line
MeasureName=MeasureCPU
X=16
Y=90
W=228
H=44
LineCount=1
LineColor=[&MeasureScript:Color('MeasurePkgTemp', #CpuWarm#, #CpuHot#)]
AntiAlias=1
DynamicVariables=1

[MeterCoreMax]
Meter=String
MeterStyle=StyleLabel
X=16
Y=144
FontSize=9
Text=hottest core  [&MeasureScript:Num('MeasureCoreMaxTemp')][\x00B0]C
FontColor=[&MeasureScript:Color('MeasureCoreMaxTemp', #CpuWarm#, #CpuHot#)]
DynamicVariables=1
