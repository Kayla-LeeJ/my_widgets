[Metadata]
Name=Music links
Information=Small strip with YouTube and Spotify shortcuts, meant to sit left of the Now Playing card.
Version=1.0
License=MIT

[Rainmeter]
Update=-1
AccurateText=1

[Variables]
YouTubeURL=https://www.youtube.com
; The Spotify app isn't installed, so this opens the web player. With the app installed, use spotify:
SpotifyURL=https://open.spotify.com
@Include=#@#Variables.inc

[MeterBackground]
Meter=Shape
Shape=Rectangle 0.5,0.5,43,91,12 | Fill Color #ColorBg# | StrokeWidth 1 | Stroke Color #ColorBorder#

; Highlight behind whichever logo the mouse is over
[MeterHover]
Meter=Shape
Shape=Rectangle 5,0,34,34,8 | Fill Color 255,255,255,25 | StrokeWidth 0
Hidden=1

[MeterYouTube]
Meter=Shape
Shape=Rectangle 8,16,28,20,6 | Fill Color 255,0,51 | StrokeWidth 0
Shape2=Path Play | Fill Color 255,255,255 | StrokeWidth 0
Play=19,21 | LineTo 27,26 | LineTo 19,31 | ClosePath 1
ToolTipText=YouTube
LeftMouseUpAction=["#YouTubeURL#"]
MouseOverAction=[!SetOption MeterHover Y 9][!ShowMeter MeterHover][!UpdateMeter MeterHover][!Redraw]
MouseLeaveAction=[!HideMeter MeterHover][!Redraw]

[MeterSpotify]
Meter=Shape
Shape=Ellipse 22,66,13 | Fill Color 30,215,96 | StrokeWidth 0
Shape2=Path Arc1 | StrokeWidth 2.6 | Stroke Color 0,0,0 | StrokeStartCap Round | StrokeEndCap Round | Fill Color 0,0,0,0
Shape3=Path Arc2 | StrokeWidth 2.2 | Stroke Color 0,0,0 | StrokeStartCap Round | StrokeEndCap Round | Fill Color 0,0,0,0
Shape4=Path Arc3 | StrokeWidth 1.8 | Stroke Color 0,0,0 | StrokeStartCap Round | StrokeEndCap Round | Fill Color 0,0,0,0
Arc1=15,61.5 | CurveTo 29.5,63,22,57.5
Arc2=16.5,66 | CurveTo 28,67.5,22,63
Arc3=17.5,70.5 | CurveTo 26.5,71.5,22,68.5
ToolTipText=Spotify
LeftMouseUpAction=["#SpotifyURL#"]
MouseOverAction=[!SetOption MeterHover Y 49][!ShowMeter MeterHover][!UpdateMeter MeterHover][!Redraw]
MouseLeaveAction=[!HideMeter MeterHover][!Redraw]
